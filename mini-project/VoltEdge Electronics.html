<head>
<meta charset="UTF-8">

<title>VoltEdge Electronics Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#06090c;--card:rgba(16,22,28,.74);--card2:rgba(0,229,168,.08);--tx:#eaf6f1;--tx2:#8aa39a;--bd:rgba(138,163,154,.18);--cy:#00e5a8;--vi:#3b9eff;--pk:#ff7a3d;--am:#ffd166;--gr:#7cf29a;--on:#04130f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{color-scheme:light;--bg:#f1f6f3;--card:rgba(255,255,255,.86);--card2:rgba(5,150,105,.07);--tx:#0c1f1a;--tx2:#53695f;--bd:rgba(5,150,105,.18);--cy:#059669;--vi:#2563eb;--pk:#ea580c;--am:#ca8a04;--gr:#16a34a;--on:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Cairo',system-ui,sans-serif}
body{background:var(--bg);color:var(--tx);min-height:100%;transition:background .5s,color .5s}
body::before,body::after{content:'';position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(140px);opacity:.16;z-index:-1;animation:dr 18s ease-in-out infinite alternate}
body::before{background:var(--cy);top:-160px;inset-inline-start:-120px}body::after{background:var(--pk);bottom:-180px;inset-inline-end:-120px;animation-delay:-9s}
@keyframes dr{to{transform:translate(120px,80px) scale(1.15)}}
.app{--gap:20px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:var(--gap);padding:var(--gap);max-width:1760px;margin:auto;align-items:start}
aside,.chat,.card,.kpi{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px}
aside{overflow-y:auto;padding:20px 14px;height:calc(100vh - 40px);position:sticky;top:20px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:4px 8px 16px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--cy),var(--vi));display:grid;place-items:center;box-shadow:0 0 18px var(--cy);flex:none}
.nv{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--tx2);padding:12px 14px;border-radius:10px;font-size:14px;cursor:pointer;transition:.25s;text-align:start}
.nv:hover{background:var(--card2);color:var(--tx);transform:translateX(3px)}
[dir=rtl] .nv:hover{transform:translateX(-3px)}
.nv.on{background:linear-gradient(90deg,color-mix(in srgb,var(--cy) 18%,transparent),transparent);color:var(--cy);box-shadow:inset 3px 0 0 var(--cy)}
[dir=rtl] .nv.on{box-shadow:inset -3px 0 0 var(--cy)}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}.lang{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);border:1px solid var(--bd);color:var(--tx);padding:10px;border-radius:10px;cursor:pointer;font-weight:600;transition:.25s}
.lang:hover{border-color:var(--cy);box-shadow:0 0 12px color-mix(in srgb,var(--cy) 30%,transparent)}
main{min-width:0;display:flex;flex-direction:column;gap:var(--gap)}
.sl{backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:end;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}.sl .rst{height:42px;width:100%;padding:0 12px;white-space:nowrap}
.fg{display:flex;flex-direction:column;gap:6px;min-width:0}
label{font-size:11px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:0 12px;height:42px;width:100%;border-radius:10px;transition:.25s}
select:hover,select:focus{border-color:var(--cy);outline:0}
.pg{display:none}.pg.on{display:flex;flex-direction:column;gap:var(--gap);animation:up .55s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.kpi{display:flex;align-items:center;gap:12px;padding:20px 16px;transition:.3s}.kb{min-width:0;flex:1}
.kpi:hover,.card:hover{transform:translateY(-4px);border-color:var(--cy);box-shadow:0 10px 26px -10px color-mix(in srgb,var(--cy) 45%,transparent)}
.ic{display:block}.kv{font-size:clamp(19px,1.9vw,25px);font-weight:800;line-height:1.35;white-space:normal;overflow-wrap:break-word}.kpi .ib{width:42px;height:42px}.ib{width:46px;height:46px}.ib.sm{width:28px;height:28px;margin-inline-end:10px}.lang{gap:10px}.rst{gap:10px}.logo{color:var(--on)}.logo svg{stroke:currentColor}.logo .core{fill:currentColor}
.rst{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card2);border:1px dashed var(--bd);color:var(--tx2);padding:9px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:.3s}.rst svg{transition:transform .6s}.rst:hover{color:var(--pk);border-color:var(--pk)}.rst:hover svg{transform:rotate(-360deg)}.rst.act{color:var(--pk);border:1px solid var(--pk);box-shadow:0 0 14px -4px var(--pk)}.rst.sp svg{animation:rs .6s}@keyframes rs{to{transform:rotate(-360deg)}}
.core{transform-origin:12px 12px;animation:cp 1.8s ease-in-out infinite}@keyframes cp{50%{transform:scale(.7);opacity:.7}}.pins{animation:pn 1.8s ease-in-out infinite}@keyframes pn{50%{opacity:.3}}
.ib{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:var(--on);flex:none;transition:.4s cubic-bezier(.3,1.6,.5,1);box-shadow:0 8px 18px -6px var(--g)}
.ib.sm{width:26px;height:26px;border-radius:8px;box-shadow:none;display:inline-grid;vertical-align:middle;margin-inline-end:8px}
.c1{background:linear-gradient(135deg,var(--cy),var(--vi));--g:var(--cy)}.c2{background:linear-gradient(135deg,var(--vi),var(--pk));--g:var(--vi)}.c3{background:linear-gradient(135deg,var(--pk),var(--am));--g:var(--pk)}.c4{background:linear-gradient(135deg,var(--am),var(--gr));--g:var(--am)}.c5{background:linear-gradient(135deg,var(--gr),var(--cy));--g:var(--gr)}

.ib svg{animation:flt 3.2s ease-in-out infinite}.kpi:nth-child(2) .ib svg{animation-delay:.5s}.kpi:nth-child(3) .ib svg{animation-delay:1s}.kpi:nth-child(4) .ib svg{animation-delay:1.5s}.kpi:nth-child(5) .ib svg{animation-delay:2s}
@keyframes flt{50%{transform:translateY(-3px) rotate(-7deg)}}
.kpi:hover .ib,tr:hover .ib,.ch:hover .ib{transform:rotate(-10deg) scale(1.18)}
.ni{display:grid}.ni svg{transition:.4s cubic-bezier(.3,1.6,.5,1)}.nv:hover .ni svg{transform:scale(1.25) rotate(-8deg)}.nv.on .ni svg{animation:pop .7s}
@keyframes pop{40%{transform:scale(1.45) rotate(10deg)}}
#th svg{transition:transform .7s}#th:hover svg{transform:rotate(180deg)}
.in button{display:grid;place-items:center;color:var(--on)}.in button svg{transition:.3s}.in button:hover svg{transform:translate(3px,-3px)}
.logo svg{transition:.4s cubic-bezier(.3,1.6,.5,1)}.brand:hover .logo svg{transform:scale(1.2) rotate(-12deg)}.logo{border-radius:14px;background:linear-gradient(135deg,var(--cy),var(--vi),var(--pk));animation:glow 3s infinite}.orb{transform-origin:12px 12px;animation:spn 9s linear infinite}.bz{transform-origin:12px 12px;animation:zap 2.2s ease-in-out infinite}@keyframes spn{to{transform:rotate(360deg)}}@keyframes zap{50%{transform:scale(1.18)}}@keyframes glow{50%{box-shadow:0 0 30px var(--vi)}}
.kt{font-size:13px;font-weight:700;color:var(--tx2);margin-bottom:4px}.kv{font-size:24px;font-weight:700;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
.g2 .w{grid-column:1/-1}
.card{padding:20px;transition:.3s}
.ct{font-weight:600;font-size:15px;margin-bottom:16px}
.cv{position:relative;height:310px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--tx2);font-weight:600;text-align:start;padding:8px;border-bottom:1px solid var(--bd)}
td{padding:9px 8px;border-bottom:1px solid var(--bd)}
tr{transition:background .2s}tbody tr:hover{background:var(--card2)}
.bar{height:6px;border-radius:4px;background:var(--bd);min-width:70px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--vi));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.chat{position:fixed;inset-block-end:94px;inset-inline-end:24px;width:min(390px,calc(100vw - 32px));height:min(580px,calc(100vh - 126px));z-index:50;display:flex;flex-direction:column;padding:18px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);box-shadow:0 24px 60px -12px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(24px) scale(.94);transform-origin:bottom right;transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.3,1.2),visibility .3s}
[dir=rtl] .chat{transform-origin:bottom left}.chat.open{opacity:1;visibility:visible;transform:none}
.fab{position:fixed;inset-block-end:24px;inset-inline-end:24px;z-index:60;width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;color:var(--on);background:linear-gradient(135deg,var(--cy),var(--vi),var(--pk));box-shadow:0 10px 26px -6px var(--cy);display:grid;place-items:center;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.fab:hover{transform:scale(1.1) rotate(-8deg)}.fab.on{transform:rotate(90deg)}.fab::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--cy);animation:rp 2.4s ease-out infinite}.fab.on::after{display:none}@keyframes rp{to{transform:scale(1.7);opacity:0}}
.x{margin-inline-start:auto;background:none;border:0;color:var(--tx2);cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;transition:.25s}.x:hover{background:var(--card2);color:var(--pk);transform:rotate(90deg)}
.ch{display:flex;align-items:center;gap:10px;font-weight:700;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.35}}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 2px}
.m{max-width:88%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.6;white-space:pre-wrap;animation:up .35s}
.m.u{align-self:flex-end;background:var(--card2);border:1px solid var(--bd)}
.m.b{align-self:flex-start;background:linear-gradient(135deg,var(--cy),var(--vi));color:var(--on);font-weight:500;box-shadow:0 8px 22px -8px var(--vi)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--card2);border:1px solid var(--bd);color:var(--tx2);border-radius:20px;padding:5px 11px;font-size:11.5px;cursor:pointer;transition:.25s}
.chip:hover{color:var(--cy);border-color:var(--cy);transform:translateY(-2px)}
.in{display:flex;gap:8px}
.in input{flex:1;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;transition:.25s}
.in input:focus{outline:0;border-color:var(--cy)}
.in button{background:linear-gradient(135deg,var(--vi),var(--pk));border:0;border-radius:10px;width:42px;cursor:pointer;font-size:16px;transition:.25s}
.in button:hover{transform:scale(1.08)}
@media(max-width:1180px){.app{grid-template-columns:200px minmax(0,1fr)}}
@media(max-width:900px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.sl{grid-template-columns:repeat(2,minmax(0,1fr))}.sl .rst{grid-column:1/-1}}
@media(max-width:520px){.kp{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:64px minmax(0,1fr);--gap:12px}.brand>span,.nv>span[data-t],#th span{display:none}.nv{justify-content:center}.brand{justify-content:center;padding:4px 0 12px}.lang{padding:10px 0}.kpi{padding:14px;gap:12px}.ib{width:40px;height:40px}}
@media(max-width:760px){.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 $('sl').querySelectorAll('select').forEach(s=>{s.value=F[s.dataset.k];s.onchange=()=>{F[s.dataset.k]=s.value;render()}});
 $('rs').onclick=()=>{F={y:'ALL',r:'ALL',c:'ALL',p:'ALL'};slicers();render();const b=$('rs');b.classList.add('sp');setTimeout(()=>b.classList.remove('sp'),600)}}
function texts(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('q').placeholder=t('ph');
 $('chips').innerHTML=SUG[lang].map(s=>`<span class="chip">${s}</span>`).join('');$('chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>send(c.textContent));
 $('lg').textContent=lang?'English':'العربية';document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));$('go').innerHTML=ic('send',18);const op=document.querySelector('.chat').classList.contains('open');$('fab').innerHTML=ic(op?'close':'spark',26);$('cx').innerHTML=ic('close',18);$('fab').title=t('ai');setTh(th);slicers()}
document.querySelectorAll('.nv').forEach(b=>b.onclick=()=>{page=b.dataset.p;document.querySelectorAll('.nv').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pg').forEach(s=>s.classList.toggle('on',s.id==='pg-'+page));render()});
$('th').onclick=()=>setTh(th==='dark'?'light':'dark',1);
function chatOpen(o){document.querySelector('.chat').classList.toggle('open',o);$('fab').classList.toggle('on',o);$('fab').innerHTML=ic(o?'close':'spark',26);if(o)setTimeout(()=>$('q').focus(),380)}
$('fab').onclick=()=>chatOpen(!document.querySelector('.chat').classList.contains('open'));$('cx').onclick=()=>chatOpen(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')chatOpen(false)});
$('lg').onclick=()=>{lang^=1;document.documentElement.lang=lang?'ar':'en';document.documentElement.dir=lang?'rtl':'ltr';texts();render()};
// ---- Chat engine: answers computed from the data (rule-based, EN + AR) ----
const norm=s=>s.toLowerCase().replace(/[\u064B-\u065F]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
const has=(q,w)=>w.some(x=>q.includes(x));
function ask(raw){
 const L=/[\u0600-\u06FF]/.test(raw)?1:0,q=' '+norm(raw)+' ',M=(a,b)=>L?b:a,n=money;
 const AP=[['laptop','لابتوب'],['monitor','شاشه','4k'],['keyboard','كيبورد'],['mouse','ماوس']],AR=[['north','شمال'],['east','شرق'],['south','جنوب'],['west','غرب']];
 const pi=AP.findIndex(a=>has(q,a)),ri=AR.findIndex(a=>has(q,a)),ov={};
 const grow=has(q,['growth','compare','vs','نمو','مقارنه']);
 if(pi>=0)ov.p=pi;if(ri>=0)ov.r=ri;if(!grow){if(q.includes('2023'))ov.y='2023';if(q.includes('2024'))ov.y='2024'}
 const g={...F,...ov},f=filt(ov);
 const ctx=[g.y!=='ALL'&&g.y,g.r!=='ALL'&&RN[g.r][L],g.c!=='ALL'&&CN[g.c][L],g.p!=='ALL'&&PN[g.p][L]].filter(Boolean).join(' · ');
 const end=s=>ctx?s+'\n('+ctx+')':s;
 if(!f.length)return t('nd');
 const tot=sum(f);
 if(grow){const a=filt({...ov,y:'2023'}),b=filt({...ov,y:'2024'}),r3=sum(a),r4=sum(b),p=r3?(r4-r3)/r3*100:0;
  return end(M(`2023: ${n(r3)} (${a.length} orders)\n2024: ${n(r4)} (${b.length} orders)\nChange: ${p>=0?'+':''}${p.toFixed(1)}%`,`2023: ${n(r3)} (${a.length} طلب)\n2024: ${n(r4)} (${b.length} طلب)\nالتغيّر: ${p>=0?'+':''}${p.toFixed(1)}%`))}
 const worst=has(q,['worst','lowest','least','weakest','اقل','اضعف','ادني']),best=has(q,['best',' top ','most','highest','lead','افضل','اكثر','اعلي','اقوي']);
 if(best||worst){
  let list;
  if(has(q,['customer','عميل','عملاء']))list=by(f,0,CU.length).map((e,i)=>({n:CU[i],...e})),lab=M('customer','عميل');
  else if(has(q,['month','شهر']))list=MO[L].map((m,i)=>{const z=f.filter(x=>+x[4].slice(5,7)===i+1);return{n:m,o:z.length,r:sum(z)}}),lab=M('month','شهر');
  else if(has(q,['region','منطقه','مناطق']))list=by(f,3,4).map((e,i)=>({n:RN[i][L],...e})),lab=M('region','منطقة');
  else if(has(q,['category','فئه','تصنيف']))list=by(f,2,2).map((e,i)=>({n:CN[i][L],...e})),lab=M('category','فئة');
  else list=by(f,1,4).map((e,i)=>({n:PN[i][L],...e})),lab=M('product','منتج');
  var lab;list=list.filter(e=>e.o).sort((a,b)=>worst?a.r-b.r:b.r-a.r);const e=list[0],s=list[1];
  return end(M(`${worst?'Lowest':'Top'} ${lab}: ${e.n}\nRevenue ${n(e.r)} (${(e.r/tot*100).toFixed(1)}%) from ${e.o} orders`+(s?`\nNext: ${s.n} — ${n(s.r)}`:''),`${worst?'أقل':'أعلى'} ${lab}: ${e.n}\nالإيرادات ${n(e.r)} (${(e.r/tot*100).toFixed(1)}%) من ${e.o} طلب`+(s?`\nيليه: ${s.n} — ${n(s.r)}`:'')))}
 if(has(q,['zero','صفر','free']))return end(M(`${f.filter(x=>!x[6]).length} of ${f.length} orders have zero revenue (quantity or price is 0).`,`${f.filter(x=>!x[6]).length} من ${f.length} طلب إيراده صفر (الكمية أو السعر = 0).`));
 if(has(q,['average','avg','aov','متوسط']))return end(M(`Average order value: ${n(tot/f.length)}`,`متوسط قيمة الطلب: ${n(tot/f.length)}`));
 if(has(q,['unit','qty','quantity','كميه','قطع','قطعه']))return end(M(`Units sold: ${sum(f,5).toLocaleString('en-US')}`,`القطع المباعة: ${sum(f,5).toLocaleString('en-US')}`));
 if(has(q,['order','طلب','اوردر']))return end(M(`Total orders: ${f.length}`,`عدد الطلبات: ${f.length}`));
 if(has(q,['category','فئه','تصنيف'])){const c=by(f,2,2);return end(c.map((e,i)=>`${CN[i][L]}: ${n(e.r)}`).join('\n'))}
 return end(M(`Total revenue: ${n(tot)}\nOrders: ${f.length} · Units: ${sum(f,5)}`,`إجمالي الإيرادات: ${n(tot)}\nالطلبات: ${f.length} · القطع: ${sum(f,5)}`))}
function add(c,x){const d=document.createElement('div');d.className='m '+c;d.textContent=x;$('msgs').appendChild(d);$('msgs').scrollTop=1e6;return d}
function send(x){x=(x||'').trim();if(!x)return;add('u',x);const b=add('b','…');$('q').value='';setTimeout(()=>{b.textContent=ask(x);$('msgs').scrollTop=1e6},550)}
$('go').onclick=()=>send($('q').value);$('q').onkeydown=e=>{if(e.key==='Enter')send($('q').value)};
texts();render();add('b',t('hi'));

</script>
